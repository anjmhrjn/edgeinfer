# Isolated environment for NVIDIA ModelOpt (D-024). ModelOpt's ONNX extra pins onnx and
# onnxruntime versions older than the main project's, so it gets its own lockfile and is
# called from edgeinfer through a subprocess, never imported into the main environment.
[project]
name = "edgeinfer-modelopt"
version = "0.1.0"
requires-python = ">=3.12,<3.13"
dependencies = [
    "nvidia-modelopt[onnx]==0.47.0",
]

[tool.uv]
package = false
