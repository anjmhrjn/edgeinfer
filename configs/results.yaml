# Which report backs each number in docs/results.md and the README's results table (D-041).
# scripts/make_results.py reads only this file and the reports it names, all relative to
# artifacts/reports/. A report must be committed from a clean tree; the cells of one row must
# have measured the same artifact.

models:
  segformer_b0: SegFormer-B0
  deeplabv3plus_mbv2: DeepLabV3+ MobileNetV2

# TensorRT 11.3 on the T4, full val (500 images) at 512x1024. The first row of each model is
# its FP32 reference; `final` marks the engine D-035 deployed. Latency: the probe at the
# 990 MHz lock (D-027).
main:
  segformer_b0:
    - label: FP32
      eval: eval__segformer_b0__trt__fp32__eval_val__c5__512x1024__ad4bfcf.json
      perf: perf__segformer_b0__trt__fp32__3a086ea.json
      note: latency from C4's probe, on the same engine at the same clock lock; C5 timed only the finalists and FP16.
    - label: FP16
      final: true
      eval: eval__segformer_b0__trt__fp16__eval_val__c5__512x1024__ad4bfcf.json
      perf: perf__segformer_b0__trt__fp16__c5__6efac63.json
      parity: parity__segformer_b0__trt__fp16__golden_val32__golden__d188731.json
      note: the engine file is about the size of the FP32 one, unlike DeepLab's, which halves. C4 recorded this; the cause isn't established.
    - label: INT8+FP16, s0.patch_embed in FP16 (best INT8)
      eval: eval__segformer_b0__trt__sens_s0.patch_embed__eval_val__c5__512x1024__ad4bfcf.json
      perf: perf__segformer_b0__trt__sens_s0.patch_embed__c5__6efac63.json
      parity: parity__segformer_b0__trt__sens_s0.patch_embed__golden_val32__golden__e9742d5.json
  deeplabv3plus_mbv2:
    - label: FP32
      eval: eval__deeplabv3plus_mbv2__trt__fp32__eval_val__c5__512x1024__ad4bfcf.json
      perf: perf__deeplabv3plus_mbv2__trt__fp32__3a086ea.json
      note: latency from C4's probe, on the same engine at the same clock lock; C5 timed only the finalists and FP16.
    - label: FP16
      eval: eval__deeplabv3plus_mbv2__trt__fp16__eval_val__c5__512x1024__ad4bfcf.json
      perf: perf__deeplabv3plus_mbv2__trt__fp16__c5__6efac63.json
      parity: parity__deeplabv3plus_mbv2__trt__fp16__golden_val32__golden__d188731.json
    - label: INT8+FP32, bb.stem_16 in FP32 (C3 model)
      eval: eval__deeplabv3plus_mbv2__trt__int8_c3_sens__eval_val__c5__512x1024__ad4bfcf.json
      perf: perf__deeplabv3plus_mbv2__trt__int8_c3_sens__c5__6efac63.json
      parity: parity__deeplabv3plus_mbv2__trt__int8_c3_sens__golden_val32__golden__5efd53c.json
    - label: INT8+FP16, bb.stem_16 in FP16
      final: true
      eval: eval__deeplabv3plus_mbv2__trt__int8fp16_sens__eval_val__c5__512x1024__ad4bfcf.json
      perf: perf__deeplabv3plus_mbv2__trt__int8fp16_sens__c5__6efac63.json
      parity: parity__deeplabv3plus_mbv2__trt__int8fp16_sens__golden_val32__golden__5efd53c.json

# The subset reported as held out (D-017): val without the 100 sensitivity-scoring images.
held_out: val_minus_sens100

# One model, the same full val, across harnesses: each step should change nothing but the
# resolution (C1) or the runtime (C2, C4).
accuracy_chain:
  segformer_b0:
    - {label: "PyTorch, 1024x2048", eval: eval__segformer_b0__torch_ref__eval_val__1024x2048__8677951.json}
    - {label: "PyTorch, 512x1024", eval: eval__segformer_b0__torch_ref__eval_val__512x1024__8677951.json}
    - {label: "ONNX Runtime CPU FP32", eval: eval__segformer_b0__ort_cpu__eval_val__512x1024__e264b0b.json}
    - {label: "TensorRT FP32", eval: eval__segformer_b0__trt__fp32__eval_val__c5__512x1024__ad4bfcf.json}
  deeplabv3plus_mbv2:
    - {label: "PyTorch, 1024x2048", eval: eval__deeplabv3plus_mbv2__torch_ref__eval_val__1024x2048__8677951.json}
    - {label: "PyTorch, 512x1024", eval: eval__deeplabv3plus_mbv2__torch_ref__eval_val__512x1024__8677951.json}
    - {label: "ONNX Runtime CPU FP32", eval: eval__deeplabv3plus_mbv2__ort_cpu__eval_val__512x1024__e264b0b.json}
    - {label: "TensorRT FP32", eval: eval__deeplabv3plus_mbv2__trt__fp32__eval_val__c5__512x1024__ad4bfcf.json}

# ONNX Runtime CPU, full val at 512x1024 (C3). The first row is the FP32 reference.
ort_int8:
  segformer_b0:
    - {label: FP32, eval: eval__segformer_b0__ort_cpu__eval_val__512x1024__e264b0b.json}
    - {label: FP16, eval: eval__segformer_b0__ort_cpu__fp16__eval_val__512x1024__e3b683e.json}
    - {label: "INT8, min/max", eval: eval__segformer_b0__ort_cpu__int8_minmax__eval_val__512x1024__cb60f28.json}
    - {label: "INT8, entropy", eval: eval__segformer_b0__ort_cpu__int8_entropy__eval_val__512x1024__cb60f28.json}
    - {label: "INT8, percentile", eval: eval__segformer_b0__ort_cpu__int8_percentile__eval_val__512x1024__cb60f28.json}
    - label: "INT8, percentile, sensitivity exclusions"
      eval: eval__segformer_b0__ort_cpu__int8_percentile__sens__eval_val__512x1024__da584fa.json
      note: the same model as the row above (artifact `8b88379284a9`); sensitivity analysis excluded no layer group.
  deeplabv3plus_mbv2:
    - {label: FP32, eval: eval__deeplabv3plus_mbv2__ort_cpu__eval_val__512x1024__e264b0b.json}
    - {label: FP16, eval: eval__deeplabv3plus_mbv2__ort_cpu__fp16__eval_val__512x1024__e3b683e.json}
    - {label: "INT8, min/max", eval: eval__deeplabv3plus_mbv2__ort_cpu__int8_minmax__eval_val__512x1024__cb60f28.json}
    - {label: "INT8, entropy", eval: eval__deeplabv3plus_mbv2__ort_cpu__int8_entropy__eval_val__512x1024__cb60f28.json}
    - {label: "INT8, percentile", eval: eval__deeplabv3plus_mbv2__ort_cpu__int8_percentile__eval_val__512x1024__cb60f28.json}
    - {label: "INT8, percentile, sensitivity exclusions", eval: eval__deeplabv3plus_mbv2__ort_cpu__int8_percentile__sens__eval_val__512x1024__da584fa.json}

# Latency vs accuracy (C5): the pareto reports hold every point; the final reports apply the
# decision rule (D-033) to the finalists.
pareto:
  segformer_b0:
    pareto: pareto__segformer_b0__dd84833.json
    final: final__segformer_b0__acaa81b.json
    labels:  # the final report's labels -> the names used on this page
      fp16: FP16
      sens_s0.patch_embed: INT8+FP16, s0.patch_embed in FP16
      sens_s2.attn_matmul: INT8+FP16, s2.attn_matmul in FP16
      sens_s2.mlp: INT8+FP16, s2.mlp in FP16
  deeplabv3plus_mbv2:
    pareto: pareto__deeplabv3plus_mbv2__dd84833.json
    final: final__deeplabv3plus_mbv2__acaa81b.json
    labels:
      fp16: FP16
      int8_c3_sens: INT8+FP32, bb.stem_16 in FP32 (C3 model)
      int8fp16_sens: INT8+FP16, bb.stem_16 in FP16

# Per-layer time by layer type, trtexec --dumpProfile at 990 MHz (C5): FP16 vs the best INT8.
profile:
  segformer_b0:
    - {label: FP16, trtexec: trtexec__segformer_b0__fp16__c5profile__990MHz__ab77361.json}
    - {label: best INT8, trtexec: trtexec__segformer_b0__sens_s0.patch_embed__c5profile__990MHz__ab77361.json}
  deeplabv3plus_mbv2:
    - {label: FP16, trtexec: trtexec__deeplabv3plus_mbv2__fp16__c5profile__990MHz__ab77361.json}
    - {label: final INT8, trtexec: trtexec__deeplabv3plus_mbv2__int8fp16_sens__c5profile__990MHz__ab77361.json}

# Gated deployment runs (C6), each a deploy report.
deploy:
  - {label: "DeepLab final, TensorRT (gates cold)", deploy: deploy/deeplabv3plus_mbv2/20261017T205607Z/deploy.json}
  - {label: "DeepLab final, TensorRT, rerun", deploy: deploy/deeplabv3plus_mbv2/20261017T213611Z/deploy.json}
  - {label: "SegFormer final, TensorRT (gates cold)", deploy: deploy/segformer_b0/20261017T211841Z/deploy.json}
  - {label: "SegFormer final, TensorRT, rerun from Airflow", deploy: deploy/segformer_b0/20261017T213659Z/deploy.json}
  - {label: "DeepLab INT8 runner-up, TensorRT, one command", deploy: deploy/deeplabv3plus_mbv2__int8/20261017T201932Z/deploy.json}
  - {label: "DeepLab final, ONNX Runtime CPU (cold)", deploy: deploy/deeplabv3plus_mbv2__ort_cpu/20261017T182358Z/deploy.json}
  - {label: "DeepLab final, ONNX Runtime CPU, rerun", deploy: deploy/deeplabv3plus_mbv2__ort_cpu/20261017T185213Z/deploy.json}
  - {label: "Fault: SegFormer INT8+FP16 without D-034's exclusions", deploy: deploy/segformer_b0__int8fp16_no_unfused/20261017T213435Z/deploy.json}
  - {label: "Fault: DeepLab with BGR preprocessing", deploy: deploy/deeplabv3plus_mbv2__bgr_ort_cpu/20261017T185633Z/deploy.json}
rollback: registry/rollback__deeplabv3plus_mbv2__production__20261017T213644Z.json

# The same engine measured by the C5 selection and again by the C6 perf gate.
rerun:
  - {label: "DeepLab final", first: perf__deeplabv3plus_mbv2__trt__int8fp16_sens__c5__6efac63.json, second: deploy/deeplabv3plus_mbv2/20261017T205607Z/perf.json}
  - {label: "SegFormer final", first: perf__segformer_b0__trt__fp16__c5__6efac63.json, second: deploy/segformer_b0/20261017T211841Z/perf.json}
  - {label: "DeepLab INT8 runner-up", first: perf__deeplabv3plus_mbv2__trt__int8_c3_sens__c5__6efac63.json, second: deploy/deeplabv3plus_mbv2__int8/20261017T201932Z/perf.json}

# The README's table: these rows of `main`, by model and label.
readme:
  - {model: segformer_b0, label: FP32}
  - {model: segformer_b0, label: FP16}
  - {model: segformer_b0, label: "INT8+FP16, s0.patch_embed in FP16 (best INT8)"}
  - {model: deeplabv3plus_mbv2, label: FP32}
  - {model: deeplabv3plus_mbv2, label: FP16}
  - {model: deeplabv3plus_mbv2, label: "INT8+FP16, bb.stem_16 in FP16"}
