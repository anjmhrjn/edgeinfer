# Parity tolerances by candidate precision, used by `edgeinfer parity` (D-014).
# fp32: 10x headroom over the worst legitimate FP32 variation measured on the Mac
# (ORT vs PyTorch golden, ORT optimization levels and thread counts), 100x on 1-cosine
# because 1-cos grows with the square of the error. Revisit for TensorRT FP32 in C4.
fp32:
  input_max_abs: 1.0e-5          # ~40 float32 ulps; one 8-bit intensity step is ~0.017
  logits_max_abs: 1.0e-3         # worst observed 8.8e-5
  logits_cosine_min: 0.999999999 # worst observed 1-cos 2.9e-12
  argmax_agreement_min: 0.999    # at 1e-3 drift, <= 4.3e-4 of pixels/image are near-ties
  miou_delta_max: 0.001          # points on the golden images; worst observed 2e-5
  layer_cosine_min: 0.99999999   # worst observed per-layer 1-cos 2.4e-11
  layer_rel_max_abs: 2.0e-4      # worst observed per-layer 1.5e-5
# int8 (D-018): INT8 changes the logits by design, and its error has no FP32-style noise
# floor to scale from, so elementwise and per-layer drift are reported, not gated (null).
# The gate is accuracy: the budget's 1.0 mIoU point, here on the golden images as a proxy
# (the budget itself is checked on full val). Preprocessing is unchanged from FP32.
int8:
  input_max_abs: 1.0e-5
  logits_max_abs: null
  logits_cosine_min: null
  argmax_agreement_min: null
  miou_delta_max: 1.0
  layer_cosine_min: null
  layer_rel_max_abs: null
