# SegFormer-B0 (transformer), Cityscapes fine-tune at 1024x1024 crops.
name: segformer_b0
architecture: segformer
weights:
  source: huggingface
  repo: nvidia/segformer-b0-finetuned-cityscapes-1024-1024
  revision: 21b3847fae21ddee674abd31129307b6a1235bd9
  # HF tag "other"; upstream NVlabs/SegFormer: NVIDIA Source Code License,
  # non-commercial (research or evaluation) use only.
  license: NVIDIA Source Code License for SegFormer (non-commercial)
num_classes: 19
output_stride: 4  # logits come out at 1/4 of the input resolution
input:
  height: 512
  width: 1024
  layout: NCHW
  dtype: float32
  channel_order: RGB
# Matches preprocessor_config.json (ImageNet mean/std, bilinear), except the size:
# the HF processor resizes to 512x512 and distorts the aspect ratio; we don't.
preprocess:
  resize: bilinear
  scale: 255.0
  mean: [0.485, 0.456, 0.406]
  std: [0.229, 0.224, 0.225]
postprocess:
  upsample: bilinear
