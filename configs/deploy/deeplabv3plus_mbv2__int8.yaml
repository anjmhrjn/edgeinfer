# DeepLab's C5 runner-up: INT8+FP32 with the stem in FP32 (C3's deployed exclusions).
# Published after the final engine to demonstrate rollback.
model: deeplabv3plus_mbv2
precision: int8
quant:
  config: int8_percentile
  exclusions: deeplabv3plus_mbv2__sens
  groups: null
fp16: null
build: build
target: trt
gates: gates
