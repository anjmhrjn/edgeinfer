# DeepLab's final model on ORT CPU (development host). Perf isn't enforced here, so this
# deployment can only reach the `dev` alias.
model: deeplabv3plus_mbv2
precision: int8_fp16
quant:
  config: int8_percentile
  exclusions: deeplabv3plus_mbv2__sens
fp16: null
build: null
target: ort_cpu
gates: gates
