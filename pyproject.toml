[project]
name = "edgeinfer"
version = "0.1.0"
description = "Validate, profile and gate PyTorch segmentation models on their way to TensorRT."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "jsonschema>=4.26.0",
    "numpy>=2.2.6",
    "onnx>=1.23.2",
    "onnxruntime>=1.31.0",
    "onnxscript>=0.7.2",
    "pillow>=12.3.0",
    "pyyaml>=6.0.3",
    "torch>=2.14.1",
    "transformers>=5.19.0",
]

[project.scripts]
edgeinfer = "edgeinfer.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[dependency-groups]
dev = [
    "pre-commit>=4.6.2",
    "pytest>=9.1.1",
    "ruff>=0.17.0",
]

[tool.ruff]
line-length = 100
target-version = "py311"
extend-exclude = ["src/edgeinfer/models/third_party"]

[tool.ruff.format]
exclude = ["*.md"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "BLE", "SIM", "RUF"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra --strict-markers"
markers = [
    "gpu: needs an NVIDIA GPU with TensorRT (never runs in CI)",
    "data: needs the Cityscapes dataset at $CITYSCAPES_ROOT",
    "weights: needs downloaded model checkpoints",
]
