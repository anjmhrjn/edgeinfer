name: ci

on:
  push:
  pull_request:

jobs:
  lint-and-test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        # 3.11 is the supported minimum (D-011); 3.12 is the pinned dev version.
        python: ["3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          python-version: ${{ matrix.python }}
      - run: uv sync --locked
      - run: uv run ruff check .
      - run: uv run ruff format --check .
      # GPU, dataset and checkpoint tests run manually, never in CI.
      - run: uv run pytest -m "not gpu and not data and not weights and not modelopt and not airflow"

  # The deploy DAG loaded by Airflow itself, in its isolated environment (D-038). The main
  # environment is installed without PyTorch: the DAG test only needs the pipeline's stages.
  airflow-dag:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          python-version: "3.12"
      - run: uv sync --locked --no-group models
      - run: uv sync --locked --project tools/airflow
      - run: uv run --no-sync pytest tests/test_airflow_dag.py -m airflow
