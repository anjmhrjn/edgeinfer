name: ci

on:
  push:
  pull_request:

jobs:
  lint-and-test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        # 3.11 is the supported minimum (D-011); 3.12 is the pinned dev version.
        python: ["3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          python-version: ${{ matrix.python }}
      - run: uv sync --locked
      - run: uv run ruff check .
      - run: uv run ruff format --check .
      # GPU, dataset and checkpoint tests run manually, never in CI.
      - run: uv run pytest -m "not gpu and not data and not weights and not modelopt"
